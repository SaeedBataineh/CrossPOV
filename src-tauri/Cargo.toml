[package]
name = "crosspov"
version = "0.7.3"
description = "CrossPOV desktop app"
edition = "2021"
publish = false

[lib]
name = "crosspov_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.18.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
ureq = { version = "3.5.2", default-features = false, features = ["json", "native-tls", "gzip"] }
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["local-offset", "parsing", "formatting", "macros"] }
nnnoiseless = { version = "0.5.2", default-features = false }
png = "0.18"

[features]
# One self-contained CrossPOV.exe that updates by replacing itself. FFmpeg and
# yt-dlp are downloaded on first run and checked against fingerprints build.rs
# takes from src-tauri/binaries (see tools.rs).
single-exe = []

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# "unwind": a crash in one background task is caught (and logged to
# crash.log) instead of closing the whole app.
panic = "unwind"
strip = true

[target."cfg(windows)".dependencies]
# The same version Tauri already uses: puts the hidden window's browser to sleep.
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
