[package]
name = "crosspov"
version = "0.1.0"
description = "CrossPOV desktop app"
edition = "2021"
publish = false

[lib]
name = "crosspov_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ureq = { version = "3.5.2", default-features = false, features = ["json", "native-tls", "gzip"] }

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
