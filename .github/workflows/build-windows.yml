name: Build Windows app

# Builds CrossPOV.exe (one file, no setup) and the installer on a Windows
# machine, from one compile. Download them from the run's "Artifacts".
#
# Releasing: bump the version (node scripts/bump-version.mjs 0.2.0), commit
# and push. A push whose version hasn't been released yet publishes it in the
# same run, and every installed copy updates itself. ("Run workflow" with
# "release" ticked, or pushing a tag like v0.2.0, also work.)
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/scoreboard-poc.yml"
      - ".github/workflows/vps-scanner.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the current version (installed apps update to it)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    # A small FFmpeg with only what CrossPOV uses (~7 MB instead of ~130 MB).
    # Cached: it only rebuilds when scripts/build-ffmpeg.sh changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out/ffmpeg.exe
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 nasm pkg-config
          scripts/build-ffmpeg.sh ffmpeg-out/ffmpeg.exe "$RUNNER_TEMP/ffbuild"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-small
          path: ffmpeg-out/ffmpeg.exe
          retention-days: 3

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the server
        run: npm run typecheck:server
      - name: Test the server
        run: npm run test:server

  build:
    needs: ffmpeg
    runs-on: windows-latest
    permissions:
      contents: write # only used to create the Release
    steps:
      - uses: actions/checkout@v4

      - name: Is this a release?
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          $asked = "${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release }}" -eq "true"
          # A push to the main branch of a version that has no release yet is a release.
          # Only the main branch: two branches publishing the same version at once mix
          # their files, and the update's signature no longer matches the download.
          $released = git ls-remote --tags origin "refs/tags/v$version"
          $onMain = "${{ github.ref_name }}" -eq "${{ github.event.repository.default_branch }}"
          $newVersion = "${{ github.event_name }}" -eq "push" -and -not $isTag -and $onMain -and -not $released
          $release = $isTag -or $asked -or $newVersion
          if ($release -and (($isTag -and "v$version" -ne "${{ github.ref_name }}") -or $npm -ne $version -or $cargo -ne $version)) {
            throw "Tag ${{ github.ref_name }}, tauri.conf.json ($version), package.json ($npm) and Cargo.toml ($cargo) must match. Run: node scripts/bump-version.mjs <version>"
          }
          "RELEASE=$($release.ToString().ToLower())" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          if ($release) { "Releasing v$version" } else { "Not a release (v$version is already out)" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-small
          path: ffmpeg-small

      - name: Check the small FFmpeg has everything CrossPOV uses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item ffmpeg-small/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          $ff = "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          "FFmpeg size: {0:N1} MB" -f ((Get-Item $ff).Length / 1MB)
          $need = @{ "-filters" = "ddagrab","hwdownload","scale","pan","alimiter"; "-encoders" = "h264_nvenc","h264_amf","h264_mf","hevc_nvenc","hevc_amf","hevc_mf","aac","mjpeg"; "-muxers" = "segment","mpegts","mp4","matroska","image2"; "-demuxers" = "concat","mpegts","mov","hls"; "-protocols" = "https" }
          foreach ($k in $need.Keys) {
            $list = & $ff -hide_banner $k 2>&1 | Out-String
            foreach ($n in $need[$k]) { if ($list -notmatch "\b$n\b") { throw "FFmpeg is missing $n ($k)" } }
          }
          # The whole clip pipeline on Windows' own encoder: record segments, join them, make a thumbnail.
          $t = Join-Path $env:RUNNER_TEMP "fftest"; New-Item -ItemType Directory -Force $t | Out-Null
          & $ff -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30" -t 6 -vf format=nv12 -c:v h264_mf -g 60 -f segment -segment_time 2 -segment_format mpegts "$t/seg%03d.ts"
          if ($LASTEXITCODE) { throw "recording test failed" }
          Get-ChildItem "$t/seg*.ts" | ForEach-Object { "file '$($_.FullName -replace '\\','/')'" } | Set-Content "$t/list.txt"
          & $ff -hide_banner -loglevel error -f concat -safe 0 -i "$t/list.txt" -c copy -movflags +faststart "$t/clip.mp4"
          if ($LASTEXITCODE) { throw "joining test failed" }
          & $ff -hide_banner -loglevel error -ss 1 -i "$t/clip.mp4" -frames:v 1 -vf scale=480:-2 -q:v 4 "$t/thumb.jpg"
          if ($LASTEXITCODE -or -not (Test-Path "$t/thumb.jpg")) { throw "thumbnail test failed" }
          "FFmpeg pipeline OK"

      - name: Download yt-dlp
        shell: pwsh
        run: ./scripts/get-ytdlp.ps1

      - name: Run Rust tests
        shell: pwsh
        run: |
          $env:CROSSPOV_FFMPEG = (Resolve-Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe).Path
          $env:CROSSPOV_YTDLP = (Resolve-Path src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe).Path
          # Streamer clips end to end: yt-dlp + this FFmpeg cut 10 s out of a public
          # HLS stream (Twitch VODs are HLS) over HTTPS, as the app does with a VOD.
          $env:CROSSPOV_TEST_HLS = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
          # Real HTTPS to crosspov.com with the app's TLS settings.
          cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored

      - name: Build CrossPOV.exe and the installer (one compile)
        shell: pwsh
        env:
          # Signs updates so installed apps accept them. Without the secret the build still works, just without update files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # FFmpeg and yt-dlp are not inside the exe: it downloads them on first run and
          # only accepts these exact files (build.rs compiles in their SHA-256).
          # Every copy, installed or not, updates by replacing its own exe.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --features single-exe
          } else {
            if ($env:RELEASE -eq "true") { throw "Releases need the TAURI_SIGNING_PRIVATE_KEY secret, or installed apps can't update." }
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, building without update files."
            Set-Content src-tauri/no-updater.json '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --features single-exe --config src-tauri/no-updater.json
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/crosspov.exe out/CrossPOV.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig out/ -ErrorAction SilentlyContinue
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri signer sign --password "" out/CrossPOV.exe
            if (-not (Test-Path out/CrossPOV.exe.sig)) { throw "CrossPOV.exe was not signed" }
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Write latest.json for auto-update
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/*-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $singleSig = Get-Content out/CrossPOV.exe.sig -Raw
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$($setup.Name)"
          @{
            version = $version
            notes = "CrossPOV $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              # Installed copies update with the installer...
              "windows-x86_64" = @{ signature = $sig.Trim(); url = $url }
              # ...the single CrossPOV.exe replaces itself.
              "windows-x86_64-single" = @{ signature = $singleSig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/CrossPOV.exe" }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: CrossPOV-windows
          path: out/*
          if-no-files-found: error

      - name: Name the tools by their fingerprint
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools-out | Out-Null
          foreach ($t in @(@("ffmpeg", "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"), @("yt-dlp", "src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe"))) {
            $h = (Get-FileHash $t[1] -Algorithm SHA256).Hash.ToLower()
            Copy-Item $t[1] "tools-out/$($t[0])-$($h.Substring(0, 16)).exe"
          }
          Get-ChildItem tools-out | Format-Table Name, Length

      # Before the app release, so a new version never points at tools that aren't there yet.
      - name: Publish the tools the app downloads
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools
          target_commitish: ${{ github.sha }}
          name: CrossPOV tools (FFmpeg and yt-dlp)
          body: FFmpeg and yt-dlp, downloaded by CrossPOV on first run. Each file is named after the start of its SHA-256; the app checks the whole fingerprint before using it.
          files: tools-out/*
          make_latest: false

      - name: Check the published tools download and match
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools-out) {
            $url = "https://github.com/${{ github.repository }}/releases/download/tools/$($f.Name)"
            $dl = Join-Path $env:RUNNER_TEMP $f.Name
            Invoke-WebRequest $url -OutFile $dl
            if ((Get-FileHash $dl).Hash -ne (Get-FileHash $f.FullName).Hash) { throw "$url doesn't match the built file" }
            "$($f.Name) OK"
          }

      - name: Publish the Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: CrossPOV ${{ env.TAG }}
          files: out/*
          make_latest: true
