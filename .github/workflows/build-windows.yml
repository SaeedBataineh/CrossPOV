name: Build Windows app

# Builds CrossPOV.exe (portable) and the installer on a Windows machine.
# Download them from the run's "Artifacts" section, or from Releases when
# you push a version tag like v0.1.0.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/scoreboard-poc.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the server
        run: npm run typecheck:server
      - name: Test the server
        run: npm run test:server

  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach files to a Release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - name: Download FFmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get-ffmpeg.ps1

      - name: Download yt-dlp
        shell: pwsh
        run: ./scripts/get-ytdlp.ps1

      - name: Run Rust tests
        shell: pwsh
        run: |
          $env:CROSSPOV_FFMPEG = (Resolve-Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe).Path
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the app and installer
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Portable version: CrossPOV.exe + ffmpeg.exe + yt-dlp.exe side by side, zipped.
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/crosspov.exe portable/CrossPOV.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/ffmpeg.exe
          Copy-Item src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe portable/yt-dlp.exe
          Compress-Archive -Path portable/* -DestinationPath out/CrossPOV-portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CrossPOV-windows
          path: out/*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
