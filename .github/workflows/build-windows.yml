name: Build Windows app

# Builds CrossPOV.exe (portable) and the installer on a Windows machine.
# Download them from the run's "Artifacts" section, or from Releases.
# To release: Actions > Build Windows app > Run workflow, tick "release".
# It tags the current version (from tauri.conf.json) and publishes it, and
# every installed app updates itself. Pushing a tag like v0.1.0 also works.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/scoreboard-poc.yml"
      - ".github/workflows/vps-scanner.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the current version (installed apps update to it)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the server
        run: npm run typecheck:server
      - name: Test the server
        run: npm run test:server

  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used to create the Release
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - name: Download FFmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get-ffmpeg.ps1

      - name: Download yt-dlp
        shell: pwsh
        run: ./scripts/get-ytdlp.ps1

      - name: Run Rust tests
        shell: pwsh
        run: |
          $env:CROSSPOV_FFMPEG = (Resolve-Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe).Path
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check the version for the release
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if (($isTag -and "v$version" -ne "${{ github.ref_name }}") -or $npm -ne $version -or $cargo -ne $version) {
            throw "Tag ${{ github.ref_name }}, tauri.conf.json ($version), package.json ($npm) and Cargo.toml ($cargo) must match. Run: node scripts/bump-version.mjs <version>"
          }
          "TAG=v$version" >> $env:GITHUB_ENV

      - name: Build the app and installer
        shell: pwsh
        env:
          # Signs the update so installed apps accept it. Without the secret the build still works, just without auto-update files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build
          } else {
            if ($env:RELEASE -eq "true") { throw "Releases need the TAURI_SIGNING_PRIVATE_KEY secret, or installed apps can't update." }
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, building without auto-update files."
            Set-Content src-tauri/no-updater.json '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --config src-tauri/no-updater.json
          }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Portable version: CrossPOV.exe + ffmpeg.exe + yt-dlp.exe side by side, zipped.
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/crosspov.exe portable/CrossPOV.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/ffmpeg.exe
          Copy-Item src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe portable/yt-dlp.exe
          Compress-Archive -Path portable/* -DestinationPath out/CrossPOV-portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig out/ -ErrorAction SilentlyContinue
          Get-ChildItem out | Format-Table Name, Length

      - name: Write latest.json for auto-update
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/*-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$($setup.Name)"
          @{
            version = $version
            notes = "CrossPOV $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } }
          } | ConvertTo-Json -Depth 4 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: CrossPOV-windows
          path: out/*
          if-no-files-found: error

      - name: Publish the Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: CrossPOV ${{ env.TAG }}
          files: out/*
          make_latest: true
