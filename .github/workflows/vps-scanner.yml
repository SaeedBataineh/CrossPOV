name: Scanner on VPS

# Sends the scoreboard scanner to the CrossPOV server (VPS) and runs it
# there. Started by hand: Actions -> Scanner on VPS -> Run workflow.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST             server IP address
#   VPS_SSH_KEY          private deploy key for the "crosspov" user
#   TWITCH_CLIENT_ID     Twitch app client id
#   TWITCH_CLIENT_SECRET Twitch app client secret
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many streams to read (0 = all live VALORANT streams)"
        default: "0"

concurrency:
  group: vps-scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          TID: ${{ secrets.TWITCH_CLIENT_ID }}
          TSECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing VPS_HOST"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$TID" ] || missing="$missing TWITCH_CLIENT_ID"
          [ -n "$TSECRET" ] || missing="$missing TWITCH_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Set up SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host vps\n  HostName %s\n  User crosspov\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config
          ssh vps 'echo "connected as $(whoami) on $(hostname), $(nproc) CPUs"'

      - name: Deploy scanner and credentials
        env:
          TID: ${{ secrets.TWITCH_CLIENT_ID }}
          TSECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          scp tools/scoreboard_poc/poc.py vps:/opt/crosspov/poc.py
          # Credentials go over SSH stdin into a file only the crosspov user can read.
          printf 'TWITCH_CLIENT_ID=%s\nTWITCH_CLIENT_SECRET=%s\n' "$TID" "$TSECRET" | ssh vps 'umask 077 && cat > /opt/crosspov/.env'

      - name: Run the scoreboard sweep on the VPS
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          [ "$LIMIT" = "0" ] && LIMIT=100000
          ssh vps "cd /opt/crosspov && set -a && . ./.env && set +a && rm -rf out && ./venv/bin/python poc.py --limit $LIMIT --out out" | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch results
        if: always()
        run: |
          mkdir -p poc-out
          scp -r 'vps:/opt/crosspov/out/*' poc-out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-scoreboard-results
          path: poc-out/
          if-no-files-found: ignore
